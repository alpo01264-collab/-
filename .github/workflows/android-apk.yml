name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Собрать debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Подготовить APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/arena-terminal.apk
          {
            echo "### APK готов"
            echo ""
            echo "- Файл: \`arena-terminal.apk\`"
            echo "- Размер: $(du -h dist/arena-terminal.apk | cut -f1)"
            echo "- SHA-256: \`$(sha256sum dist/arena-terminal.apk | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: arena-terminal-apk
          path: dist/arena-terminal.apk
          if-no-files-found: error

      - name: Опубликовать в релизе apk-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest dist/arena-terminal.apk --clobber
          else
            gh release create apk-latest dist/arena-terminal.apk \
              --title "Терминал — APK" \
              --notes "APK из ветки ${{ github.ref_name }} (коммит ${{ github.sha }}). Подпись отладочная. После установки укажите адрес сервера терминала, например http://192.168.1.10:3000 — сервер запускается командой npm start."
          fi
