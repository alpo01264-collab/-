name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Подготовить APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/arena-terminal.apk
          {
            echo "### APK готов"
            echo ""
            echo "- Размер: $(du -h dist/arena-terminal.apk | cut -f1)"
            echo "- SHA-256: $(sha256sum dist/arena-terminal.apk | cut -d' ' -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Проверить APK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          BADGING="$RUNNER_TEMP/badging.txt"
          "$BUILD_TOOLS/aapt2" dump badging dist/arena-terminal.apk > "$BADGING"

          APP_PACKAGE="$(grep -m1 '^package:' "$BADGING" | sed -E "s/.* name='([^']+)'.*/\1/")"
          echo "Пакет: $APP_PACKAGE"
          test "$APP_PACKAGE" = "ai.arena.terminal" || { echo "Неожиданный applicationId: $APP_PACKAGE"; exit 1; }
          grep -q "^launchable-activity:" "$BADGING" || { echo "В APK нет точки запуска"; exit 1; }

          grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity):" "$BADGING" | head -8
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/arena-terminal.apk | head -4

          {
            echo ""
            echo "### Проверка APK"
            echo '```'
            grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity):" "$BADGING" | head -8
            "$BUILD_TOOLS/apksigner" verify --print-certs dist/arena-terminal.apk | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: arena-terminal-apk
          path: dist/arena-terminal.apk
          if-no-files-found: error

      - name: Опубликовать в релизе apk-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BADGING="$RUNNER_TEMP/badging.txt"
          SIZE="$(du -h dist/arena-terminal.apk | cut -f1)"
          SHA="$(sha256sum dist/arena-terminal.apk | cut -d' ' -f1)"
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"

          PKG_NAME="$(awk -F"'" '/^package:/ {print $2; exit}' "$BADGING")"
          VERSION_CODE="$(awk -F"'" '/^package:/ {print $4; exit}' "$BADGING")"
          VERSION_NAME="$(awk -F"'" '/^package:/ {print $6; exit}' "$BADGING")"
          MIN_SDK="$(awk -F"'" '(/^sdkVersion:/ || /^minSdkVersion:/) {print $2; exit}' "$BADGING")"
          TARGET_SDK="$(awk -F"'" '/^targetSdkVersion:/ {print $2; exit}' "$BADGING")"
          LABEL="$(awk -F"'" '/^application-label:/ {print $2; exit}' "$BADGING")"

          case "$MIN_SDK" in
            23) ANDROID_MIN="6.0" ;;
            24) ANDROID_MIN="7.0" ;;
            26) ANDROID_MIN="8.0" ;;
            29) ANDROID_MIN="10" ;;
            30) ANDROID_MIN="11" ;;
            31) ANDROID_MIN="12" ;;
            *) ANDROID_MIN="API $MIN_SDK" ;;
          esac

          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Терминал для Android

          Мобильный клиент терминала: открывает веб-интерфейс вашего сервера и запоминает его адрес.
          После установки укажите адрес сервера — например http://192.168.1.10:3000.

          - **Название:** $LABEL
          - **Пакет:** $PKG_NAME, версия $VERSION_NAME (код $VERSION_CODE)
          - **Android:** $ANDROID_MIN и новее (minSdk $MIN_SDK, targetSdk $TARGET_SDK)
          - **Размер:** $SIZE
          - **SHA-256:** $SHA
          - **Сборка:** ветка $GITHUB_REF_NAME, коммит $SHORT_SHA
          - **Подпись:** отладочная (Android Debug) — только для личной установки

          ### Как подключиться

          1. Запустите сервер терминала: npm start (нужен Node.js 18+).
          2. Скачайте APK и разрешите установку из неизвестных источников.
          3. Укажите адрес сервера, например http://192.168.1.10:3000. Телефон и компьютер должны быть в одной сети.
          4. Сменить адрес: кнопка ⚙ в правом верхнем углу, долгое нажатие на «Терминал» в шапке или пункт «Настройки сервера» в меню по кнопке «Назад».

          Сервер выполняет команды без авторизации — используйте приложение только в доверенной сети.
          NOTES

          if [ -z "$MIN_SDK" ] || [ -z "$TARGET_SDK" ]; then
            {
              echo ""
              echo "### Диагностика APK"
              echo '```'
              head -20 "$BADGING"
              echo '```'
            } >> "$RUNNER_TEMP/notes.md"
          fi

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release upload apk-latest dist/arena-terminal.apk --clobber
            gh release edit apk-latest --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create apk-latest dist/arena-terminal.apk \
              --title "Терминал — APK" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
